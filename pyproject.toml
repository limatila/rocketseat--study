[project]
name = "rocketseat-study"
version = "0.4"
description = "Main environment for rocketseat data analysis study"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "notebook>=7.5.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
]

[project.optional-dependencies]

auto_EDA = [
    "sweetviz>=2.3.1",
    "numpy<2"
]
